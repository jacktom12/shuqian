<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <!-- 缺了这行，手机浏览器会按 980px 虚拟宽度缩放渲染，所有响应式断点全部失效 -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>我的书签</title>
    <link rel="icon" href="https://api.iconify.design/lucide:bookmark-check.svg?color=%237aa2ff" type="image/svg+xml">
    <script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script>
    <!-- 尽早套用上次的主题，避免首屏先闪一下深色再跳浅色 -->
    <script>
        (function () {
            try {
                var t = localStorage.getItem("bm_theme");
                if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
            } catch (e) {}
        })();
    </script>
    <!-- daisyUI 语义化组件库（CDN 完整版，自带 dark/light 主题；放在自定义样式之前，保证下方玻璃拟态样式可覆盖它） -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4/dist/full.min.css" rel="stylesheet" type="text/css" />
    <style>
        /* ===== 全局重置 & 变量 ===== */
        :root {
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-bg-strong: rgba(255, 255, 255, 0.14);
            --glass-border: rgba(255, 255, 255, 0.18);
            --text: #f2f3f7;
            --text-dim: rgba(242, 243, 247, 0.6);
            --accent: #7aa2ff;
            --accent2: #a58bff;
            --accent-glow: rgba(122, 162, 255, 0.55);
            --radius-lg: 26px;
            --radius-md: 18px;
            --radius-sm: 12px;
            --danger: #ff6b6b;
            --top-height: 46px;
            --sidebar-width: 170px;

            /* --- 主题派生变量（深色为默认）---
               深浅切换只改这一组变量，所有控件自动跟随，
               所以别在具体规则里再写死 rgba(255,255,255,...) / rgba(0,0,0,...) */
            --hover-bg: rgba(255, 255, 255, 0.08);
            --hover-bg-strong: rgba(255, 255, 255, 0.14);
            --panel-bg: rgba(28, 30, 40, 0.88); /* 下拉、搜索提示、Toast */
            --panel-bg-soft: rgba(24, 26, 34, 0.78); /* 弹窗 */
            --chip-bg: rgba(255, 255, 255, 0.12); /* 分类计数、标签小胶囊 */
            --chip-bg-strong: rgba(255, 255, 255, 0.25);
            --input-bg: rgba(255, 255, 255, 0.06);
            --scrim: rgba(5, 6, 10, 0.55); /* 弹窗遮罩 */
            --count-text: #e9ebf5; /* 分类计数专用文字色，保证暗色下也清晰 */
            --shadow-soft: rgba(0, 0, 0, 0.2);
            --shadow-mid: rgba(0, 0, 0, 0.28);
            --shadow-strong: rgba(0, 0, 0, 0.45);
            --title-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
            --bg-filter: brightness(0.55) saturate(1.1);
            --bg-overlay-grad: linear-gradient(160deg, rgba(10, 12, 20, 0.35) 0%, rgba(10, 12, 20, 0.65) 100%);
        }

        /* ===== 浅色主题 ===== */
        [data-theme="light"] {
            --glass-bg: rgba(255, 255, 255, 0.58);
            --glass-bg-strong: rgba(255, 255, 255, 0.78);
            --glass-border: rgba(18, 24, 48, 0.12);
            --text: #1b1f2a;
            --text-dim: rgba(27, 31, 42, 0.66);
            --accent-glow: rgba(122, 162, 255, 0.35);
            --hover-bg: rgba(18, 24, 48, 0.07);
            --hover-bg-strong: rgba(18, 24, 48, 0.13);
            --panel-bg: rgba(255, 255, 255, 0.94);
            --panel-bg-soft: rgba(255, 255, 255, 0.92);
            --chip-bg: rgba(18, 24, 48, 0.1);
            --chip-bg-strong: rgba(255, 255, 255, 0.55);
            --input-bg: rgba(255, 255, 255, 0.85);
            --scrim: rgba(20, 24, 35, 0.35);
            --count-text: #2b3145;
            --shadow-soft: rgba(20, 30, 60, 0.1);
            --shadow-mid: rgba(20, 30, 60, 0.14);
            --shadow-strong: rgba(20, 30, 60, 0.18);
            --title-shadow: none;
            --bg-filter: brightness(0.88) saturate(0.95);
            --bg-overlay-grad: linear-gradient(160deg, rgba(255, 255, 255, 0.55) 0%, rgba(255, 255, 255, 0.78) 100%);
        }

        ::-webkit-scrollbar {
            display: none;
            width: 0;
            height: 0;
        }
        * {
            box-sizing: border-box;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        html,
        body {
            margin: 0;
            height: 100vh;
            /* 手机浏览器地址栏伸缩时 100vh 会抖，dvh 能动态跟随；老浏览器自动回退 vh */
            height: 100dvh;
            overflow: hidden;
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            color: var(--text);
            transition: color 0.3s ease;
        }

        /* ===== 背景 ===== */
        #bg {
            position: fixed;
            inset: 0;
            z-index: -2;
            background-size: cover;
            background-position: center;
            filter: var(--bg-filter);
            transition: opacity 0.6s ease, filter 0.3s ease;
        }
        #bg-overlay {
            position: fixed;
            inset: 0;
            z-index: -1;
            background: var(--bg-overlay-grad);
            transition: background 0.3s ease;
        }

        /* ===== 新布局：纵向 flex ===== */
        .layout {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            padding: 22px 28px 28px 28px;
            gap: 18px;
        }

        /* ===== Topbar ===== */
        .topbar {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
            width: 100%;
            position: relative;
            z-index: 60;
        }

        /* ---- 统一顶部控件样式 ---- */
        .topbar .ctrl {
            height: var(--top-height);
            border-radius: 999px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(24px) saturate(150%);
            -webkit-backdrop-filter: blur(24px) saturate(150%);
            font-size: 13.5px;
            color: var(--text);
            display: flex;
            align-items: center;
            flex-shrink: 0;
            padding: 0 14px;
            transition: background 0.2s, border-color 0.2s;
            box-shadow: 0 8px 30px var(--shadow-soft);
        }
        .topbar .ctrl:hover {
            background: var(--glass-bg-strong);
        }

        /* ---- 搜索引擎下拉 (左) ---- */
        .custom-select {
            position: relative;
            flex-shrink: 0;
            height: var(--top-height);
            display: flex;
            align-items: center;
        }
        .cs-trigger {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 0 10px 0 14px;
            height: 100%;
            border-radius: 999px;
            cursor: pointer;
            font-size: 13.5px;
            color: var(--text);
            user-select: none;
            transition: background 0.2s;
            white-space: nowrap;
        }
        .cs-trigger:hover {
            background: var(--hover-bg);
        }
        .cs-trigger .arrow {
            font-size: 13px;
            opacity: 0.6;
            transition: transform 0.2s;
            display: flex;
            align-items: center;
        }
        .custom-select.open .cs-trigger .arrow {
            transform: rotate(180deg);
        }
        .cs-options {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            min-width: 110px;
            background: var(--panel-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(26px) saturate(160%);
            border-radius: 16px;
            padding: 6px;
            box-shadow: 0 16px 40px var(--shadow-strong);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.18s ease, transform 0.18s ease;
            z-index: 9999;
            /* translateZ(0) 强制独立 GPU 层，绕开 iOS backdrop-filter 的层叠怪癖 */
            transform: translateY(-6px) translateZ(0);
        }
        /* 关键：backdrop-filter 让 .custom-select 自成堆叠上下文，
           内部 z-index 再高也出不去。手机端顶栏是两行，第二行按钮在 DOM 里
           排后面会盖住下拉，所以展开时要把整个容器抬到第二行之上。 */
        .custom-select.open {
            z-index: 80;
        }
        .custom-select.open .cs-options {
            opacity: 1;
            transform: translateY(0) translateZ(0);
            pointer-events: auto;
        }
        .cs-option {
            padding: 7px 12px;
            border-radius: 10px;
            font-size: 13px;
            cursor: pointer;
            color: var(--text-dim);
            transition: background 0.15s, color 0.15s;
        }
        .cs-option:hover {
            background: var(--hover-bg);
            color: var(--text);
        }
        .cs-option.selected {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: #fff;
        }

        /* ---- 搜索输入框 (中间, 弹性) ---- */
        .search-shell {
            flex: 1;
            min-width: 120px;
            height: var(--top-height);
            border-radius: 999px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(24px) saturate(150%);
            -webkit-backdrop-filter: blur(24px) saturate(150%);
            display: flex;
            align-items: center;
            padding: 0 4px 0 0;
            box-shadow: 0 8px 30px var(--shadow-soft);
            position: relative;
            z-index: 60;
            flex-shrink: 1;
        }
        .search-shell .suggest-wrap {
            flex: 1;
            position: relative;
            height: 100%;
            display: flex;
            align-items: center;
        }
        .search-shell input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text);
            font-size: 13.5px;
            padding: 0 10px;
            height: 100%;
            min-width: 40px;
        }
        .search-shell input::placeholder {
            color: var(--text-dim);
        }

        /* 主搜索清除按钮 */
        .search-shell .query-clear {
            flex-shrink: 0;
            width: 28px;
            height: 28px;
            min-height: 0; /* 覆盖 daisyUI .btn 的 min-height */
            padding: 0;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-dim);
            font-size: 15px;
            margin-right: 2px;
            transition: background 0.15s, color 0.15s;
        }
        .search-shell .query-clear:hover {
            background: var(--hover-bg);
            color: var(--text);
        }
        .search-shell .query-clear.show {
            display: flex;
        }

        /* 搜索按钮 */
        .search-shell .go-btn {
            flex-shrink: 0;
            width: 36px;
            height: 100%;
            min-height: 0; /* 覆盖 daisyUI .btn 的 min-height */
            padding: 0;
            border-radius: 0;
            background: transparent;
            border: none;
            color: var(--text-dim);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 16px;
            margin-right: 8px;
            transition: color 0.2s, transform 0.15s;
        }
        .search-shell .go-btn:hover {
            color: var(--text);
            transform: scale(1.1);
        }

        /* ---- 搜索提示 ---- */
        .suggest-list {
            position: absolute;
            top: calc(100% + 10px);
            left: 0;
            right: 0;
            background: var(--panel-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(28px) saturate(160%);
            border-radius: 16px;
            padding: 6px;
            box-shadow: 0 16px 40px var(--shadow-strong);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.16s ease, transform 0.16s ease;
            z-index: 9998;
            transform: translateY(-6px) translateZ(0);
            max-height: 300px;
            overflow-y: auto;
        }
        .suggest-list.show {
            opacity: 1;
            transform: translateY(0) translateZ(0);
            pointer-events: auto;
        }
        .suggest-item {
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 13.5px;
            color: var(--text-dim);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background 0.14s, color 0.14s;
        }
        .suggest-item .s-icon {
            font-size: 15px;
            opacity: 0.5;
            flex-shrink: 0;
            display: flex;
        }
        .suggest-item:hover,
        .suggest-item.highlight {
            background: var(--hover-bg);
            color: var(--text);
        }

        /* ---- 书签搜索 (固定宽度) ---- */
        .bm-search-shell {
            height: var(--top-height);
            border-radius: 999px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(24px) saturate(150%);
            -webkit-backdrop-filter: blur(24px) saturate(150%);
            display: flex;
            align-items: center;
            padding: 0 12px 0 14px;
            gap: 6px;
            flex-shrink: 0;
            width: 210px;
            box-shadow: 0 8px 30px var(--shadow-soft);
        }
        .bm-search-shell .bm-search-icon {
            font-size: 15px;
            color: var(--text-dim);
            flex-shrink: 0;
            display: flex;
        }
        .bm-search-shell input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text);
            font-size: 13.5px;
            height: 100%;
            min-width: 40px;
        }
        .bm-search-shell input::placeholder {
            color: var(--text-dim);
        }
        .bm-search-clear {
            cursor: pointer;
            color: var(--text-dim);
            font-size: 15px;
            width: 22px;
            height: 22px;
            min-height: 0; /* 覆盖 daisyUI .btn 的 min-height */
            padding: 0;
            border-radius: 50%;
            transition: background 0.15s, color 0.15s;
            display: none;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .bm-search-clear.show {
            display: flex;
        }
        .bm-search-clear:hover {
            background: var(--hover-bg);
            color: var(--text);
        }

        /* ---- 时钟 ---- */
        .clock {
            height: var(--top-height);
            border-radius: 999px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(24px) saturate(150%);
            -webkit-backdrop-filter: blur(24px) saturate(150%);
            display: flex;
            align-items: center;
            padding: 0 16px;
            font-size: 13px;
            color: var(--text-dim);
            font-family: monospace;
            letter-spacing: 0.4px;
            flex-shrink: 0;
            white-space: nowrap;
            box-shadow: 0 8px 30px var(--shadow-soft);
        }

        /* ---- 操作按钮 (圆形) ---- */
        .top-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
            align-items: center;
        }
        .icon-btn {
            width: var(--top-height);
            height: var(--top-height);
            min-height: 0; /* 覆盖 daisyUI .btn 的 min-height */
            padding: 0;
            border-radius: 50%;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(24px) saturate(150%);
            -webkit-backdrop-filter: blur(24px) saturate(150%);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 17px;
            flex-shrink: 0;
            color: var(--text);
            transition: background 0.2s, transform 0.2s, color 0.2s, box-shadow 0.2s;
            box-shadow: 0 8px 30px var(--shadow-soft);
        }
        .icon-btn:hover {
            background: var(--glass-bg-strong);
        }
        /* 旋转动效挪到内部图标上，避免 daisyUI tooltip 跟着一起倾斜 */
        .icon-btn .iconify {
            display: inline-flex;
            transition: transform 0.2s;
        }
        .icon-btn:hover .iconify {
            transform: rotate(8deg);
        }
        .icon-btn.active {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: #fff;
            border-color: transparent;
            box-shadow: 0 4px 16px var(--accent-glow);
            transform: none;
        }
        /* 抽屉模式下的文字标签：桌面端隐藏 */
        .icon-btn .btn-label {
            display: none;
        }
        /* 菜单按钮与遮罩：仅手机端显示 */
        .menu-btn,
        .menu-mask {
            display: none;
        }

        /* ===== Main Row (sidebar + content) ===== */
        .main-row {
            display: flex;
            flex: 1;
            gap: 24px;
            min-height: 0;
        }

        /* ---- Sidebar ---- */
        .sidebar {
            width: var(--sidebar-width);
            flex-shrink: 0;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(22px) saturate(140%);
            -webkit-backdrop-filter: blur(22px) saturate(140%);
            border-radius: var(--radius-lg);
            padding: 16px 12px 18px;
            box-shadow: 0 8px 32px var(--shadow-mid);
            overflow-y: auto;
            height: 100%;
        }
        .sidebar::-webkit-scrollbar {
            display: none;
        }
        .sidebar {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .cat-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 9px 12px;
            margin-bottom: 3px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 13.5px;
            color: var(--text-dim);
            transition: all 0.2s ease;
        }
        .cat-item:hover {
            background: var(--hover-bg);
            color: var(--text);
        }
        .cat-item.active {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: #fff;
            box-shadow: 0 4px 18px var(--accent-glow);
        }
        .cat-item-left {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .cat-item-left .iconify {
            font-size: 15px;
        }
        /* 分类计数：不再靠 opacity 淡化，改用专用文字色 + 更高对比底色，暗色下也一眼看清 */
        .cat-item .cat-count {
            font-size: 11.5px;
            font-weight: 600;
            line-height: 1.5;
            font-variant-numeric: tabular-nums;
            color: var(--count-text);
            background: var(--chip-bg);
            padding: 1px 7px;
            min-width: 22px;
            border: none; /* 覆盖 daisyUI .badge 的边框 */
            height: auto;
            min-height: 0;
            border-radius: 8px;
            flex-shrink: 0;
            transition: background 0.2s, color 0.2s;
        }
        .cat-item.active .cat-count {
            background: var(--chip-bg-strong);
            color: #fff;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
        }

        /* ---- 书签内容 ---- */
        .content-scroll {
            flex: 1;
            overflow-y: auto;
            padding-bottom: 20px;
            min-height: 0;
        }
        .content-scroll::-webkit-scrollbar {
            display: none;
        }
        .content-scroll {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .section-title {
            font-size: 13px;
            color: var(--text-dim);
            letter-spacing: 1px;
            margin: 0 0 14px 4px;
            text-transform: uppercase;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(126px, 1fr));
            gap: 16px;
            position: relative;
            z-index: 1;
        }

        .bm-card {
            position: relative;
            background: transparent;
            border: 1px solid transparent;
            border-radius: var(--radius-md);
            padding: 18px 8px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            color: var(--text);
        }
        .bm-card:hover {
            transform: translateY(-4px);
            background: var(--glass-bg-strong);
            border-color: var(--glass-border);
            backdrop-filter: blur(18px) saturate(140%);
            -webkit-backdrop-filter: blur(18px) saturate(140%);
            box-shadow: 0 12px 28px var(--shadow-mid);
        }

        .bm-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin-bottom: 8px;
        }
        .bm-icon img {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }
        .bm-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            min-width: 0;
        }
        .bm-title {
            font-size: 12px;
            line-height: 1.35;
            max-width: 100px;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            text-shadow: var(--title-shadow);
        }
        .bm-url,
        .bm-tags {
            display: none;
        }

        .bm-actions {
            position: absolute;
            top: 6px;
            right: 6px;
            display: none;
            gap: 4px;
            z-index: 10;
        }
        .main.edit-mode .bm-card:hover .bm-actions {
            display: flex;
        }
        .bm-actions span {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(6px);
            border-radius: 8px;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            color: #fff;
            transition: background 0.2s;
            cursor: pointer;
        }
        .bm-actions span:hover {
            background: rgba(0, 0, 0, 0.75);
        }

        .fav-badge {
            position: absolute;
            top: 6px;
            left: 8px;
            color: #ffd24f;
            font-size: 15px;
            filter: drop-shadow(0 1px 3px rgba(0, 0, 0, 0.4));
            display: flex;
            z-index: 10;
        }

        .empty-tip {
            text-align: center;
            color: var(--text-dim);
            margin-top: 50px;
            font-size: 14px;
        }

        /* ===== 书签视图切换（列表模式） ===== */
        .grid.list-view {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .grid.list-view .bm-card {
            flex-direction: row;
            align-items: center;
            justify-content: flex-start;
            text-align: left;
            padding: 10px 14px;
            border-radius: 14px;
            width: 100%;
            transform: none;
        }
        .grid.list-view .bm-card:hover {
            transform: none;
            background: var(--glass-bg-strong);
            border-color: var(--glass-border);
            backdrop-filter: blur(18px) saturate(140%);
            -webkit-backdrop-filter: blur(18px) saturate(140%);
            box-shadow: 0 8px 22px var(--shadow-mid);
        }
        .grid.list-view .bm-info {
            flex: 1;
            align-items: flex-start;
            margin-left: 12px;
            gap: 4px;
            min-width: 0;
        }
        .grid.list-view .bm-icon {
            width: 36px;
            height: 36px;
            margin-bottom: 0;
            flex-shrink: 0;
        }
        .grid.list-view .bm-icon img {
            width: 22px;
            height: 22px;
        }
        .grid.list-view .bm-title {
            display: block;
            max-width: 100%;
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            -webkit-line-clamp: unset;
        }
        .grid.list-view .bm-url {
            display: block;
            width: 100%;
            font-size: 12px;
            color: var(--text-dim);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .grid.list-view .bm-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            font-size: 11px;
            color: var(--text-dim);
            opacity: 0.85;
        }
        .grid.list-view .bm-tags span {
            background: var(--chip-bg);
            padding: 1px 8px;
            border-radius: 999px;
        }
        .grid.list-view .fav-badge {
            position: static;
            margin-right: 4px;
            font-size: 16px;
            flex-shrink: 0;
        }
        .grid.list-view .bm-actions {
            top: 50%;
            right: 12px;
            transform: translateY(-50%);
        }

        /* ===== Modal ===== */
        .overlay {
            position: fixed;
            inset: 0;
            background: var(--scrim);
            backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .overlay.show {
            display: flex;
        }
        /* 注意：自定义弹窗类名是 .modal-card，不是 .modal（daisyUI 已占用 .modal，直接复用会冲突） */
        .modal-card {
            background: var(--panel-bg-soft);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(30px) saturate(160%);
            border-radius: var(--radius-lg);
            padding: 28px 30px;
            width: 380px;
            box-shadow: 0 20px 60px var(--shadow-strong);
            animation: modalIn 0.25s ease;
        }
        @keyframes modalIn {
            from {
                opacity: 0;
                transform: translateY(14px) scale(0.97);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .modal-card h3 {
            margin: 0 0 18px;
            font-size: 18px;
            font-weight: 600;
        }
        .modal-card label {
            font-size: 12.5px;
            color: var(--text-dim);
            display: block;
            margin: 12px 0 5px;
            padding: 0; /* 覆盖 daisyUI .label 的默认内边距 */
        }
        .modal-card input:not([type="checkbox"]),
        .modal-card textarea {
            width: 100%;
            height: 40px; /* 覆盖 daisyUI .input 的 3rem 高度，保持原尺寸 */
            background: var(--input-bg);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            color: var(--text);
            padding: 9px 12px;
            font-size: 14px;
            outline: none;
        }
        .modal-card input:not([type="checkbox"]):focus {
            border-color: var(--accent);
        }
        .modal-card .row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 14px;
        }
        .modal-card .row label {
            margin: 0;
            padding: 0;
        }
        .modal-card .btns {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 24px;
        }
        .modal-card .btns button {
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            min-height: 0; /* 覆盖 daisyUI .btn 的 min-height */
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 20px;
            transition: transform 0.1s;
        }
        .modal-card .btns button:active {
            transform: scale(0.92);
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: #fff;
            box-shadow: 0 4px 16px var(--accent-glow);
        }
        .btn-secondary {
            background: var(--chip-bg);
            color: var(--text);
        }
        .btn-danger {
            background: linear-gradient(135deg, #ff6b6b, #ff9472);
            color: #fff;
            box-shadow: 0 4px 16px rgba(255, 107, 107, 0.45);
        }
        .btn-primary:hover,
        .btn-danger:hover {
            filter: brightness(1.1);
        }
        .btn-secondary:hover {
            background: var(--hover-bg-strong);
        }

        /* ===== Toast ===== */
        #toastWrap {
            position: fixed;
            top: 24px;
            right: 24px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 200;
        }
        .toast {
            min-width: 220px;
            max-width: 340px;
            background: var(--panel-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(26px) saturate(160%);
            border-radius: 14px;
            padding: 12px 16px;
            box-shadow: 0 12px 32px var(--shadow-strong);
            display: flex;
            align-items: flex-start;
            gap: 10px;
            font-size: 13.5px;
            color: var(--text);
            animation: toastIn 0.28s ease;
            border-left: 3px solid var(--accent);
        }
        .toast.success {
            border-left-color: #5ee6a0;
        }
        .toast.error {
            border-left-color: var(--danger);
        }
        .toast .t-icon {
            font-size: 18px;
            margin-top: 1px;
            display: flex;
        }
        .toast .t-msg {
            flex: 1;
            line-height: 1.4;
        }
        .toast.hide {
            animation: toastOut 0.25s ease forwards;
        }
        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateX(30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        @keyframes toastOut {
            to {
                opacity: 0;
                transform: translateX(30px);
            }
        }

        /* ===== 触摸设备适配 =====
           手机没有 hover，凡是依赖 :hover 的交互都会出问题，这里统一兜底 */
        /* 1) 关掉 daisyUI tooltip：点一下按钮后 hover 状态会一直粘着，提示词不会自己消失 */
        @media (hover: none), (any-hover: none) {
            .tooltip::before,
            .tooltip::after {
                content: none !important;
            }
        }
        /* 2) 编辑模式下常驻显示卡片操作按钮（原本要 hover 卡片才出现，手机上永远不会触发） */
        @media (hover: none), (any-hover: none) {
            body.edit-mode .bm-actions {
                display: flex !important;
            }
        }
        /* 3) 触摸设备上 :hover 会一直粘着，按钮点了就歪着不回来，改用 :active 做点击反馈
              注意排除 .active，否则编辑模式 / 列表视图的紫色高亮会被覆盖掉 */
        @media (hover: none), (any-hover: none) {
            .icon-btn:not(.active):hover {
                background: var(--glass-bg);
            }
            .icon-btn:hover .iconify {
                transform: none;
            }
            .icon-btn:not(.active):active {
                background: var(--glass-bg-strong);
            }
        }

        /* ===== 手机端：底部分类筛选（daisyUI filter）===== */
        .mobile-filter {
            display: none; /* 桌面端完全不占位 */
        }

        /* ===== 响应式 ===== */
        @media (max-width: 820px) {
            .layout {
                padding: 14px 16px 16px 16px;
                gap: 14px;
            }
            .topbar {
                flex-wrap: wrap;
                gap: 8px;
            }
            .search-shell {
                flex: 1 1 200px;
                min-width: 100px;
            }
            .bm-search-shell {
                width: 160px;
                flex: 0 1 160px;
            }
            .clock {
                font-size: 12px;
                padding: 0 12px;
            }
            .sidebar {
                width: 140px;
                padding: 12px 8px 14px;
            }
            .main-row {
                gap: 14px;
            }
            .grid {
                grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
                gap: 12px;
            }
            .grid.list-view .bm-card {
                padding: 8px 12px;
            }
            .grid.list-view .bm-info {
                margin-left: 8px;
            }
        }
        @media (max-width: 600px) {
            /* --- Toast 改到顶部居中通栏：缩在右上角容易被按钮群盖住、一闪而过看不见 --- */
            #toastWrap {
                top: 12px;
                left: 16px;
                right: 16px;
                align-items: center;
            }
            .toast {
                min-width: 0;
                max-width: 100%;
                width: 100%;
            }
            /* 手指点击区域放大 */
            .bm-actions span {
                width: 30px;
                height: 30px;
                font-size: 15px;
            }

            /* --- 侧边栏让位，分类改到底部 filter 条 --- */
            .sidebar {
                display: none;
            }
            .mobile-filter {
                /* 必须 display:block，否则继承桌面端(1025行)的 display:none */
                display: block;
                position: relative;
                flex-shrink: 0;
                /* 1.1.1.1 风格 peek 卡片：收起态只露"箭头 + 更多分类"两行，
                   上滑/点击展开全部 chip。卡片保持小，空间让给书签列表 */
                background: var(--glass-bg);
                border: 1px solid var(--glass-border);
                backdrop-filter: blur(22px) saturate(140%);
                -webkit-backdrop-filter: blur(22px) saturate(140%);
                border-radius: var(--radius-lg);
                box-shadow: 0 4px 16px var(--shadow-soft);
                padding: 8px 16px calc(6px + env(safe-area-inset-bottom));
                overflow: hidden;
                max-height: 64px;
                transition: max-height 0.34s cubic-bezier(0.32, 0.72, 0, 1);
            }
            .mobile-filter.expanded {
                max-height: 34vh;
            }
            /* 手柄：垂直排列——上箭头 + "更多分类"主标题，整行可点可滑 */
            .filter-handle {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 1px;
                width: 100%;
                margin: 0;
                padding: 0;
                background: transparent;
                border: none;
                color: var(--text);
                cursor: pointer;
                border-radius: 999px;
                transition: color 0.15s;
            }
            .filter-handle:hover,
            .filter-handle:active {
                color: var(--text);
            }
            .filter-handle .iconify {
                font-size: 18px;
                color: var(--text-dim);
                transition: transform 0.3s;
            }
            .mobile-filter.expanded .filter-handle .iconify {
                transform: rotate(180deg);
            }
            .handle-hint {
                font-size: 14px;
                font-weight: 600;
                letter-spacing: 0.3px;
            }
            /* chip 网格：收起时不占布局，展开时随高度动画 + 轻微淡入 */
            .mobile-filter:not(.expanded) .filter {
                display: none;
            }
            .mobile-filter.expanded .filter {
                display: flex;
                flex-wrap: wrap;
                gap: 6px;
                max-height: calc(34vh - 58px);
                overflow-y: auto;
                -webkit-overflow-scrolling: touch;
                overscroll-behavior: contain;
                padding: 6px 2px 2px;
                margin-top: 6px;
                animation: filterFadeIn 0.28s ease 0.08s both;
            }
            @keyframes filterFadeIn {
                from { opacity: 0; transform: translateY(6px); }
                to   { opacity: 1; transform: translateY(0); }
            }

            /* 过滤区本体 */
            .mobile-filter .filter {
                display: flex;
                flex-wrap: wrap;
                gap: 6px;
                align-items: center;
            }
            /* chip 改用 <label> 包裹的方案：避开了 iOS Safari 对 input 伪元素渲染异常
               导致的"文字重复两遍"bug（daisyUI 原生 filter 用 input + ::before） */
            .cat-chip {
                position: relative;
                display: inline-flex;
                align-items: center;
                height: 32px;
                padding: 0 12px;
                margin: 0;
                border-radius: 999px;
                font-size: 12.5px;
                line-height: 1;
                background: var(--chip-bg);
                border: 1px solid var(--glass-border);
                color: var(--text);
                flex-shrink: 0;
                cursor: pointer;
                user-select: none;
                transition: background 0.2s, color 0.2s, border-color 0.2s, box-shadow 0.2s;
            }
            /* 真·radio 元素绝对定位隐藏，但仍可聚焦、键盘操作、change 事件冒泡 */
            .cat-chip input[type="radio"] {
                position: absolute;
                opacity: 0;
                pointer-events: none;
                width: 1px;
                height: 1px;
                margin: -1px;
            }
            /* 选中态：用现代 :has() 选择器匹配当前激活的 chip（iOS 15.4+/Chromium 105+） */
            .cat-chip:has(input:checked) {
                background: linear-gradient(135deg, var(--accent), var(--accent2));
                border-color: transparent;
                color: #fff;
                box-shadow: 0 3px 12px var(--accent-glow);
            }

            /* --- 顶部栏压成一行：引擎 + 主搜索 + 书签搜索 + 菜单按钮 --- */
            /* 820px 断点让 topbar wrap 成两行，手机上必须 nowrap 压回一行 */
            .topbar {
                flex-wrap: nowrap;
                gap: 8px;
            }
            .search-shell {
                flex: 1 1 0;
                min-width: 0;
            }
            .bm-search-shell {
                flex: 1 1 0;
                width: auto;
                min-width: 0;
                /* 框变窄后图标/清除按钮挤占空间，收一点 padding */
                padding: 0 8px 0 10px;
            }
            /* iOS Safari 对 font-size < 16px 的输入框聚焦时会自动缩放页面，
               两个搜索框都放大到 16px 防缩放 */
            .search-shell input,
            .bm-search-shell input {
                font-size: 16px;
            }
            /* 引擎下拉收紧，给搜索框腾地方 */
            .custom-select .cs-trigger {
                padding: 0 8px 0 10px;
                font-size: 13px;
            }
            /* 功能按钮全部移出顶栏：变身为右侧抽屉 */
            .top-actions {
                position: fixed;
                top: 0;
                right: 0;
                bottom: 0;
                width: 240px;
                max-width: 78vw;
                flex-direction: column;
                align-items: stretch;
                gap: 6px;
                padding: calc(18px + env(safe-area-inset-top)) 12px 20px;
                background: var(--panel-bg);
                border-left: 1px solid var(--glass-border);
                backdrop-filter: blur(28px) saturate(150%);
                -webkit-backdrop-filter: blur(28px) saturate(150%);
                box-shadow: -12px 0 40px var(--shadow-strong);
                transform: translateX(100%);
                transition: transform 0.32s cubic-bezier(0.32, 0.72, 0, 1);
                z-index: 300;
                overflow-y: auto;
            }
            body.menu-open .top-actions {
                transform: translateX(0);
            }
            /* 抽屉里按钮变横条：图标 + 文字标签 */
            .top-actions .icon-btn {
                width: 100%;
                height: 46px;
                min-height: 0;
                border-radius: 14px;
                justify-content: flex-start;
                gap: 12px;
                padding: 0 14px;
                font-size: 17px;
            }
            .top-actions .icon-btn .btn-label {
                display: inline;
                font-size: 14px;
                font-weight: 500;
            }
            /* 菜单按钮：顶栏最右，常驻可见 */
            .menu-btn {
                display: flex;
                align-items: center;
                justify-content: center;
                width: var(--top-height);
                height: var(--top-height);
                min-height: 0;
                padding: 0;
                border-radius: 50%;
                background: var(--glass-bg);
                border: 1px solid var(--glass-border);
                backdrop-filter: blur(24px) saturate(150%);
                -webkit-backdrop-filter: blur(24px) saturate(150%);
                color: var(--text);
                font-size: 17px;
                flex-shrink: 0;
                cursor: pointer;
                box-shadow: 0 8px 30px var(--shadow-soft);
            }
            .menu-btn:active {
                background: var(--glass-bg-strong);
            }
            /* 遮罩：点击关闭抽屉 */
            .menu-mask {
                display: block;
                position: fixed;
                inset: 0;
                background: var(--scrim);
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.3s;
                z-index: 290;
            }
            body.menu-open .menu-mask {
                opacity: 1;
                pointer-events: auto;
            }
            .clock {
                display: none;
            }
            .grid {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
                gap: 10px;
            }
            .grid.list-view .bm-card {
                padding: 6px 10px;
            }
            .modal-card {
                width: 92%;
                padding: 20px 18px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== 背景 ===== -->
    <div id="bg"></div>
    <div id="bg-overlay"></div>
    <div id="toastWrap"></div>

    <!-- ===== 布局 ===== -->
    <div class="layout">

        <!-- ===== Topbar (全宽) ===== -->
        <div class="topbar">

            <!-- 搜索引擎下拉 -->
            <div class="custom-select ctrl" id="engineSelect" style="padding:0;">
                <div class="cs-trigger" id="csTrigger">
                    <span id="csLabel">谷歌</span>
                    <span class="iconify arrow" data-icon="lucide:chevron-down"></span>
                </div>
                <div class="cs-options" id="csOptions">
                    <div class="cs-option selected" data-value="google">谷歌</div>
                    <div class="cs-option" data-value="bing">必应</div>
                    <div class="cs-option" data-value="douban">豆瓣</div>
                    <div class="cs-option" data-value="zhihu">知乎</div>
                    <div class="cs-option" data-value="bilibili">B站</div>
                    <div class="cs-option" data-value="youtube">油管</div>
                </div>
            </div>

            <!-- 搜索框 -->
            <div class="search-shell">
                <div class="suggest-wrap">
                    <input id="query" type="text" placeholder="搜索..." autofocus autocomplete="off" />
                    <div class="suggest-list" id="suggestList"></div>
                </div>
                <span class="query-clear btn btn-ghost btn-circle tooltip tooltip-bottom" id="queryClear" data-tip="清除">
                    <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 50 50" aria-hidden="true">
                        <path d="M0 0h50v50H0z" fill="none" />
                        <path fill="currentColor" d="M25 42c-9.4 0-17-7.6-17-17S15.6 8 25 8s17 7.6 17 17s-7.6 17-17 17m0-32c-8.3 0-15 6.7-15 15s6.7 15 15 15s15-6.7 15-15s-6.7-15-15-15" />
                        <path fill="currentColor" d="m32.283 16.302l1.414 1.415l-15.98 15.98l-1.414-1.414z" />
                        <path fill="currentColor" d="m17.717 16.302l15.98 15.98l-1.414 1.415l-15.98-15.98z" />
                    </svg>
                </span>
                <button class="go-btn btn btn-ghost btn-circle tooltip tooltip-bottom" id="go" data-tip="搜索" aria-label="搜索">
                    <span class="iconify" data-icon="lucide:search"></span>
                </button>
            </div>

            <!-- 书签搜索 -->
            <div class="bm-search-shell">
                <span class="iconify bm-search-icon" data-icon="lucide:search"></span>
                <input id="bmSearch" type="text" placeholder="搜索当前书签..." autocomplete="off" />
                <span class="bm-search-clear btn btn-ghost btn-circle tooltip tooltip-bottom" id="bmSearchClear" data-tip="清除">
                    <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 50 50" aria-hidden="true">
                        <path d="M0 0h50v50H0z" fill="none" />
                        <path fill="currentColor" d="M25 42c-9.4 0-17-7.6-17-17S15.6 8 25 8s17 7.6 17 17s-7.6 17-17 17m0-32c-8.3 0-15 6.7-15 15s6.7 15 15 15s15-6.7 15-15s-6.7-15-15-15" />
                        <path fill="currentColor" d="m32.283 16.302l1.414 1.415l-15.98 15.98l-1.414-1.414z" />
                        <path fill="currentColor" d="m17.717 16.302l15.98 15.98l-1.414 1.415l-15.98-15.98z" />
                    </svg>
                </span>
            </div>

            <!-- 时钟 -->
            <div class="clock" id="clock"></div>

            <!-- 操作按钮（手机端被 CSS 变成右侧抽屉，按钮旁显示文字标签） -->
            <div class="top-actions" id="topActions">
                <button class="icon-btn btn btn-circle tooltip tooltip-bottom" id="refreshBg" data-tip="换一张壁纸" aria-label="换一张壁纸">
                    <span class="iconify" data-icon="lucide:refresh-cw"></span>
                    <span class="btn-label">换一张壁纸</span>
                </button>
                <button class="icon-btn btn btn-circle tooltip tooltip-bottom" id="addBtn" data-tip="添加书签" aria-label="添加书签">
                    <span class="iconify" data-icon="lucide:plus"></span>
                    <span class="btn-label">添加书签</span>
                </button>
                <button class="icon-btn btn btn-circle tooltip tooltip-bottom" id="settingsBtn" data-tip="设置 / 编辑模式" aria-label="设置 / 编辑模式">
                    <span class="iconify" data-icon="lucide:settings"></span>
                    <span class="btn-label">设置 / 编辑模式</span>
                </button>
                <button class="icon-btn btn btn-circle tooltip tooltip-bottom" id="viewToggle" data-tip="切换列表 / 卡片视图" aria-label="切换列表 / 卡片视图">
                    <span class="iconify" data-icon="lucide:list"></span>
                    <span class="btn-label">切换列表 / 卡片视图</span>
                </button>
                <button class="icon-btn btn btn-circle tooltip tooltip-bottom" id="themeToggle" data-tip="切换到浅色模式" aria-label="切换主题">
                    <span class="iconify" data-icon="lucide:sun"></span>
                    <span class="btn-label">切换深色 / 浅色</span>
                </button>
            </div>

            <!-- 菜单按钮：仅手机端显示，点击把 top-actions 以右侧抽屉形式滑出 -->
            <button class="menu-btn btn btn-circle" id="menuBtn" type="button" aria-label="打开功能菜单">
                <span class="iconify" data-icon="lucide:menu"></span>
            </button>
        </div>
        <!-- 抽屉遮罩：仅手机端，点击关闭功能菜单 -->
        <div class="menu-mask" id="menuMask"></div>

        <!-- ===== Main Row (sidebar + content) ===== -->
        <div class="main-row">

            <!-- 左侧分类栏（桌面端显示，手机端隐藏） -->
            <div class="sidebar" id="sidebar">
                <div id="catList"></div>
            </div>

            <!-- 右侧书签列表 -->
            <div class="content-scroll" id="contentScroll">
                <div id="sectionTitle" class="section-title">★ 收藏</div>
                <div class="grid" id="grid"></div>
                <div class="empty-tip" id="emptyTip" style="display:none;">暂无书签，点击右上角添加</div>
            </div>

        </div>

        <!-- ===== 手机端：底部分类筛选（daisyUI filter，桌面端隐藏） =====
             默认收起：只露出手柄和当前选中的那一个分类；
             点手柄 / 在手柄上向上滑 → 区域向上扩张，露出所有分类。 -->
        <nav class="mobile-filter" id="mobileFilter" aria-label="书签分类筛选">
            <button class="filter-handle" id="filterHandle" type="button" aria-label="展开更多分类">
                <span class="iconify" data-icon="lucide:chevron-up"></span>
                <span class="handle-hint">更多分类</span>
            </button>
            <div class="filter" id="mobileCatFilter"></div>
        </nav>
    </div>

    <!-- ===== Modals ===== -->
    <div class="overlay" id="pwOverlay">
        <div class="modal-card">
            <h3>请输入密码</h3>
            <label class="label">管理密码</label>
            <input type="password" id="pwInput" placeholder="输入密码" class="input input-bordered" />
            <div class="btns">
                <button class="btn-secondary btn btn-circle" id="pwCancel"><span class="iconify" data-icon="lucide:x"></span></button>
                <button class="btn-primary btn btn-circle" id="pwConfirm"><span class="iconify" data-icon="lucide:check"></span></button>
            </div>
        </div>
    </div>

    <div class="overlay" id="editOverlay">
        <div class="modal-card">
            <h3 id="editTitle">添加书签</h3>
            <label class="label">标题</label>
            <input id="f-title" type="text" class="input input-bordered" />
            <label class="label">URL</label>
            <input id="f-url" type="text" placeholder="https://" class="input input-bordered" />
            <label class="label">分类</label>
            <input id="f-category" type="text" list="categoryList" placeholder="选择或输入分类" autocomplete="off" class="input input-bordered" />
            <datalist id="categoryList"></datalist>
            <label class="label">标签（逗号分隔）</label>
            <input id="f-tags" type="text" class="input input-bordered" />
            <label class="label">描述</label>
            <input id="f-desc" type="text" class="input input-bordered" />
            <div class="row">
                <input type="checkbox" id="f-fav" class="checkbox checkbox-primary checkbox-sm" />
                <label style="margin:0;">收藏</label>
            </div>
            <div class="btns">
                <button class="btn-secondary btn btn-circle" id="editCancel"><span class="iconify" data-icon="lucide:x"></span></button>
                <button class="btn-primary btn btn-circle" id="editSave"><span class="iconify" data-icon="lucide:check"></span></button>
            </div>
        </div>
    </div>

    <div class="overlay" id="delOverlay">
        <div class="modal-card">
            <h3>确定删除吗？</h3>
            <p style="color:var(--text-dim); font-size:13.5px; margin:0;">此操作无法撤销，删除后该书签会永久移除。</p>
            <div class="btns">
                <button class="btn-secondary btn btn-circle" id="delCancel"><span class="iconify" data-icon="lucide:x"></span></button>
                <button class="btn-danger btn btn-circle" id="delConfirm"><span class="iconify" data-icon="lucide:trash-2"></span></button>
            </div>
        </div>
    </div>

    <script>
        /* ============================================================
               配置 & 工具
               ============================================================ */
        const API_BASE = "https://mrksss.199105.xyz";
        const TOKEN_KEY = "bm_auth_token";
        const TOKEN_EXP_KEY = "bm_auth_token_exp";
        const TOKEN_TTL_MS = 365 * 24 * 60 * 60 * 1000;
        const WALLPAPER_CACHE_KEY = "bm_wallpaper_url";
        const WALLPAPER_CACHE_TIME_KEY = "bm_wallpaper_time";
        const WALLPAPER_REFRESH_MS = 30 * 60 * 1000;

        const SEARCH_ENGINES = {
            google: q => `https://www.google.com/search?q=${encodeURIComponent(q)}`,
            bing: q => `https://www.bing.com/search?q=${encodeURIComponent(q)}`,
            douban: q => `https://www.douban.com/search?cat=1002&&q=${encodeURIComponent(q)}`,
            zhihu: q => `https://www.zhihu.com/search?type=content&q=${encodeURIComponent(q)}`,
            bilibili: q => `https://search.bilibili.com/all?keyword=${encodeURIComponent(q)}`,
            youtube: q => `https://www.youtube.com/results?search_query=${encodeURIComponent(q)}`,
        };

        function escapeHtml(str) {
            const d = document.createElement("div");
            d.textContent = str == null ? "" : String(str);
            return d.innerHTML;
        }

        function favicon(url) {
            try {
                const u = new URL(url);
                return `${API_BASE}/api/favicon?url=${encodeURIComponent(u.hostname)}`;
            } catch (e) {
                return "";
            }
        }

        function showToast(msg, type = "info") {
            const wrap = document.getElementById("toastWrap");
            const el = document.createElement("div");
            el.className = `toast ${type}`;
            const icon = type === "success" ? "lucide:check-circle" : type === "error" ? "lucide:x-circle" : "lucide:info";
            el.innerHTML =
                `<span class="iconify t-icon" data-icon="${icon}"></span><span class="t-msg">${msg}</span>`;
            wrap.appendChild(el);
            setTimeout(() => {
                el.classList.add("hide");
                setTimeout(() => el.remove(), 260);
            }, 3200);
        }

        /* ============================================================
           时钟
           ============================================================ */
        function updateClock() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, "0");
            const day = String(now.getDate()).padStart(2, "0");
            const hours = String(now.getHours()).padStart(2, "0");
            const minutes = String(now.getMinutes()).padStart(2, "0");
            const seconds = String(now.getSeconds()).padStart(2, "0");
            const weekDays = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];
            const weekDay = weekDays[now.getDay()];
            document.getElementById("clock").textContent =
                `${year}-${month}-${day} ${hours}:${minutes}:${seconds} ${weekDay}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        /* ============================================================
           搜索引擎下拉 + 每引擎关键词记忆
           ============================================================ */
        const engineSelect = document.getElementById("engineSelect");
        const csTrigger = document.getElementById("csTrigger");
        const csLabel = document.getElementById("csLabel");
        const csOptions = document.getElementById("csOptions");
        let currentEngine = "google";

        const engineQueryCache = {
            google: "",
            bing: "",
            douban: "",
            zhihu: "",
            bilibili: "",
            youtube: "",
        };

        csTrigger.addEventListener("click", (e) => {
            e.stopPropagation();
            engineSelect.classList.toggle("open");
        });

        csOptions.querySelectorAll(".cs-option").forEach(opt => {
            opt.addEventListener("click", () => {
                // 先保存当前引擎关键词
                engineQueryCache[currentEngine] = queryInput.value;

                currentEngine = opt.dataset.value;
                csLabel.textContent = opt.textContent;
                csOptions.querySelectorAll(".cs-option").forEach(o => o.classList.remove("selected"));
                opt.classList.add("selected");
                engineSelect.classList.remove("open");

                // 恢复目标引擎上次关键词（没有则为空）
                setQueryForEngine(currentEngine, true);
            });
        });
        document.addEventListener("click", () => engineSelect.classList.remove("open"));

        /* ============================================================
           壁纸
           ============================================================ */
        async function fetchRandomWallpaper() {
            try {
                const res = await fetch(API_BASE + "/api/wallpaper");
                const data = await res.json();
                if (!data.ok || !data.proxyUrl) throw new Error("no url");
                return API_BASE + data.proxyUrl;
            } catch (e) {
                return "https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?q=80&w=1920";
            }
        }
        async function setWallpaper(force = false) {
            const bg = document.getElementById("bg");
            const cachedUrl = localStorage.getItem(WALLPAPER_CACHE_KEY);
            const cachedTime = parseInt(localStorage.getItem(WALLPAPER_CACHE_TIME_KEY) || "0", 10);
            if (!force && cachedUrl && Date.now() - cachedTime < WALLPAPER_REFRESH_MS) {
                bg.style.backgroundImage = `url("${cachedUrl}")`;
                return;
            }
            const url = await fetchRandomWallpaper();
            localStorage.setItem(WALLPAPER_CACHE_KEY, url);
            localStorage.setItem(WALLPAPER_CACHE_TIME_KEY, String(Date.now()));
            const img = new Image();
            img.onload = () => {
                bg.style.opacity = 0;
                setTimeout(() => {
                    bg.style.backgroundImage = `url("${url}")`;
                    bg.style.opacity = 1;
                }, 200);
            };
            img.src = url;
        }
        document.getElementById("refreshBg").onclick = () => setWallpaper(true);

        /* ============================================================
           Token / 认证
           ============================================================ */
        function getToken() {
            const exp = parseInt(localStorage.getItem(TOKEN_EXP_KEY) || "0", 10);
            if (Date.now() > exp) {
                localStorage.removeItem(TOKEN_KEY);
                localStorage.removeItem(TOKEN_EXP_KEY);
                return null;
            }
            return localStorage.getItem(TOKEN_KEY);
        }
        function setToken(token) {
            localStorage.setItem(TOKEN_KEY, token);
            localStorage.setItem(TOKEN_EXP_KEY, String(Date.now() + TOKEN_TTL_MS));
        }
        async function authFetch(path, options = {}) {
            const token = getToken();
            options.headers = Object.assign({}, options.headers, {
                "Content-Type": "application/json",
                ...(token ? { Authorization: `Bearer ${token}` } : {}),
            });
            return fetch(API_BASE + path, options);
        }

        /* ============================================================
           密码弹窗
           ============================================================ */
        let pendingAction = null;

        function requirePassword(action) {
            if (getToken()) {
                action();
                return;
            }
            pendingAction = action;
            document.getElementById("pwInput").value = "";
            document.getElementById("pwOverlay").classList.add("show");
        }
        document.getElementById("pwCancel").onclick = () => {
            document.getElementById("pwOverlay").classList.remove("show");
            pendingAction = null;
        };
        document.getElementById("pwConfirm").onclick = async () => {
            const pw = document.getElementById("pwInput").value;
            try {
                const res = await fetch(API_BASE + "/api/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ password: pw }),
                });
                const data = await res.json();
                if (data.ok) {
                    setToken(data.token);
                    document.getElementById("pwOverlay").classList.remove("show");
                    showToast("验证成功，365 天内免密操作", "success");
                    if (pendingAction) pendingAction();
                    pendingAction = null;
                } else {
                    showToast("密码错误，请重新输入", "error");
                }
            } catch (e) {
                showToast("网络错误，请检查后重试", "error");
            }
        };

        /* ============================================================
           编辑模式
           ============================================================ */
        let isEditMode = false;
        // 触摸设备没有 hover，编辑按钮是常驻显示的，提示文案要告诉用户点哪儿
        const isTouchDevice = window.matchMedia("(hover: none), (any-hover: none)").matches;
        document.getElementById("settingsBtn").addEventListener("click", () => {
            requirePassword(() => {
                isEditMode = !isEditMode;
                document.body.classList.toggle("edit-mode", isEditMode);
                document.getElementById("settingsBtn").classList.toggle("active", isEditMode);
                if (!isEditMode) {
                    showToast("已关闭编辑模式", "success");
                } else {
                    showToast(
                        isTouchDevice ? "已开启编辑模式，点卡片右上角图标可编辑 / 删除" : "已开启编辑模式",
                        "success"
                    );
                }
            });
        });
        const stylePatch = document.createElement("style");
        stylePatch.textContent = `
            body.edit-mode .bm-card:hover .bm-actions { display: flex !important; }
        `;
        document.head.appendChild(stylePatch);

        /* ============================================================
           搜索 + 搜索提示 + 清除按钮
           ============================================================ */
        const queryInput = document.getElementById("query");
        const queryClear = document.getElementById("queryClear");
        const suggestList = document.getElementById("suggestList");
        let suggestTimer = null;
        let suggestItems = [];
        let highlightIndex = -1;

        document.getElementById("go").onclick = () => doSearch();

        function syncQueryClear() {
            queryClear.classList.toggle("show", !!queryInput.value);
        }

        function setQueryForEngine(engine, restoreSuggest = true) {
            queryInput.value = engineQueryCache[engine] || "";
            syncQueryClear();
            if (!restoreSuggest) {
                hideSuggest();
                return;
            }
            const q = queryInput.value.trim();
            if (!q) {
                hideSuggest();
                return;
            }
            clearTimeout(suggestTimer);
            suggestTimer = setTimeout(async () => {
                const list = await fetchSuggestions(q);
                renderSuggest(list);
            }, 80);
        }

        queryClear.addEventListener("click", (e) => {
            e.preventDefault();
            e.stopPropagation();
            queryInput.value = "";
            engineQueryCache[currentEngine] = "";
            hideSuggest();
            syncQueryClear();
            queryInput.focus();
        });

        function doSearch(text) {
            const q = (text !== undefined ? text : queryInput.value).trim();
            if (!q) {
                showToast("请输入搜索内容");
                return;
            }
            hideSuggest();
            window.open(SEARCH_ENGINES[currentEngine](q), "_blank");
        }

        async function fetchSuggestions(q) {
            try {
                const res = await fetch(
                    `${API_BASE}/api/suggest?engine=${currentEngine}&q=${encodeURIComponent(q)}`
                );
                const data = await res.json();
                return data.ok ? (data.suggestions || []) : [];
            } catch (e) {
                return [];
            }
        }

        function renderSuggest(list) {
            suggestItems = list;
            highlightIndex = -1;
            if (!list.length) {
                hideSuggest();
                return;
            }
            suggestList.innerHTML = list
                .map(
                    (s, i) =>
                        `<div class="suggest-item" data-idx="${i}"><span class="iconify s-icon" data-icon="lucide:search"></span><span>${escapeHtml(s)}</span></div>`
                )
                .join("");
            suggestList.querySelectorAll(".suggest-item").forEach(el => {
                el.addEventListener("click", () => {
                    const idx = parseInt(el.dataset.idx, 10);
                    queryInput.value = suggestItems[idx];
                    engineQueryCache[currentEngine] = queryInput.value;
                    syncQueryClear();
                    doSearch(suggestItems[idx]);
                });
            });
            suggestList.classList.add("show");
        }

        function hideSuggest() {
            suggestList.classList.remove("show");
            suggestItems = [];
            highlightIndex = -1;
        }

        function updateHighlight() {
            suggestList.querySelectorAll(".suggest-item").forEach((el, i) => {
                el.classList.toggle("highlight", i === highlightIndex);
            });
        }

        queryInput.addEventListener("input", () => {
            engineQueryCache[currentEngine] = queryInput.value;
            syncQueryClear();

            const q = queryInput.value.trim();
            clearTimeout(suggestTimer);
            if (!q) {
                hideSuggest();
                return;
            }
            suggestTimer = setTimeout(async () => {
                const list = await fetchSuggestions(q);
                renderSuggest(list);
            }, 220);
        });

        queryInput.addEventListener("keydown", e => {
            if (suggestItems.length && suggestList.classList.contains("show")) {
                if (e.key === "ArrowDown") {
                    e.preventDefault();
                    highlightIndex = (highlightIndex + 1) % suggestItems.length;
                    updateHighlight();
                    return;
                }
                if (e.key === "ArrowUp") {
                    e.preventDefault();
                    highlightIndex = (highlightIndex - 1 + suggestItems.length) % suggestItems.length;
                    updateHighlight();
                    return;
                }
                if (e.key === "Escape") {
                    hideSuggest();
                    return;
                }
            }
            if (e.key === "Enter") {
                if (highlightIndex >= 0 && suggestItems[highlightIndex]) {
                    queryInput.value = suggestItems[highlightIndex];
                    engineQueryCache[currentEngine] = queryInput.value;
                    syncQueryClear();
                    doSearch(suggestItems[highlightIndex]);
                } else {
                    doSearch();
                }
            }
        });

        document.addEventListener("click", (e) => {
            if (!e.target.closest(".suggest-wrap")) hideSuggest();
        });

        /* ============================================================
           书签数据
           ============================================================ */
        let bookmarks = [];
        let activeCategory = "__fav__";
        let searchKeyword = "";
        let viewMode = localStorage.getItem("bm_view_mode") || "grid"; // grid 卡片视图 | list 列表视图

        async function loadBookmarks() {
            try {
                const res = await fetch(API_BASE + "/api/bookmarks");
                const data = await res.json();
                bookmarks = data.ok ? data.data : [];
            } catch (e) {
                bookmarks = [];
                showToast("加载书签失败，请检查网络或接口地址", "error");
            }
            renderSidebar();
            renderGrid();
        }

        function getCategoryCounts() {
            const map = {};
            bookmarks.forEach(bm => {
                const cat = bm.category || "未分类";
                map[cat] = (map[cat] || 0) + 1;
            });
            return map;
        }

        function refreshCategoryDatalist(selected) {
            const dl = document.getElementById("categoryList");
            const counts = getCategoryCounts();
            const cats = Object.keys(counts).sort((a, b) => a.localeCompare(b, "zh-CN"));
            if (selected && !cats.includes(selected)) cats.unshift(selected);
            dl.innerHTML = cats.map(c => `<option value="${escapeHtml(c)}"></option>`).join("");
        }

        function renderSidebar() {
            const counts = getCategoryCounts();
            const catList = document.getElementById("catList");
            const cats = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
            let html = `<div class="cat-item ${activeCategory === "__all__" ? "active" : ""}" data-cat="__all__">
                    <div class="cat-item-left"><span class="iconify" data-icon="lucide:layout-grid"></span><span>全部</span></div>
                    <span class="cat-count badge badge-sm">${bookmarks.length}</span>
                </div>`;
            html += `<div class="cat-item ${activeCategory === "__fav__" ? "active" : ""}" data-cat="__fav__">
                    <div class="cat-item-left"><span class="iconify" data-icon="lucide:star"></span><span>收藏</span></div>
                    <span class="cat-count badge badge-sm">${bookmarks.filter(b => b.favorite).length}</span>
                </div>`;
            cats.forEach(cat => {
                html += `<div class="cat-item ${activeCategory === cat ? "active" : ""}" data-cat="${escapeHtml(cat)}">
                        <div class="cat-item-left"><span class="iconify" data-icon="lucide:folder"></span><span>${escapeHtml(cat)}</span></div>
                        <span class="cat-count badge badge-sm">${counts[cat]}</span>
                    </div>`;
            });
            catList.innerHTML = html;
            catList.querySelectorAll(".cat-item").forEach(el => {
                el.addEventListener("click", () => {
                    activeCategory = el.dataset.cat;
                    renderSidebar();
                    renderGrid();
                    document.getElementById("contentScroll").scrollTo({ top: 0, behavior: "smooth" });
                });
            });
            renderMobileFilter(); // 桌面点分类时同步底部 chip 的选中态
        }

        function renderGrid() {
            const grid = document.getElementById("grid");
            const sectionTitle = document.getElementById("sectionTitle");
            // 根据视图模式切换 list-view 类
            grid.classList.toggle("list-view", viewMode === "list");

            let list = bookmarks;
            let baseTitle = "全部书签";
            if (activeCategory === "__fav__") {
                list = bookmarks.filter(b => b.favorite);
                baseTitle = "★ 收藏";
            } else if (activeCategory !== "__all__") {
                list = bookmarks.filter(b => (b.category || "未分类") === activeCategory);
                baseTitle = activeCategory;
            }

            const kw = searchKeyword.trim().toLowerCase();
            if (kw) {
                list = list.filter(b => {
                    const title = (b.title || "").toLowerCase();
                    const desc = (b.desc || "").toLowerCase();
                    const tags = (b.tags || []).join(",").toLowerCase();
                    const url = (b.url || "").toLowerCase();
                    return title.includes(kw) || desc.includes(kw) || tags.includes(kw) || url.includes(kw);
                });
                sectionTitle.textContent = `${baseTitle} · 搜索"${searchKeyword.trim()}"（${list.length} 条）`;
            } else {
                sectionTitle.textContent = baseTitle;
            }

            grid.innerHTML = "";
            document.getElementById("emptyTip").style.display = list.length ? "none" : "block";
            list
                .slice()
                .sort((a, b) => (b.favorite - a.favorite))
                .forEach(bm => {
                    const card = document.createElement("a");
                    card.className = "bm-card";
                    card.href = bm.url;
                    card.target = "_blank";
                    card.innerHTML = `
                            ${bm.favorite ? '<span class="iconify fav-badge" data-icon="lucide:star" style="fill:currentColor;"></span>' : ""}
                            <span class="bm-actions">
                                <span data-act="edit"><span class="iconify" data-icon="lucide:edit-2"></span></span>
                                <span data-act="del"><span class="iconify" data-icon="lucide:trash-2"></span></span>
                            </span>
                            <div class="bm-icon"><img src="${favicon(bm.url)}" onerror="this.style.display='none'"/></div>
                            <div class="bm-info">
                                <div class="bm-title">${escapeHtml(bm.title || bm.url)}</div>
                                <div class="bm-url">${escapeHtml(bm.url)}</div>
                                ${bm.tags && bm.tags.length ? `<div class="bm-tags">${bm.tags.map(t => `<span>${escapeHtml(t)}</span>`).join("")}</div>` : ""}
                            </div>
                        `;
                    card.querySelector('[data-act="edit"]').addEventListener("click", ev => {
                        ev.preventDefault();
                        ev.stopPropagation();
                        openEditModal(bm);
                    });
                    card.querySelector('[data-act="del"]').addEventListener("click", ev => {
                        ev.preventDefault();
                        ev.stopPropagation();
                        openDeleteModal(bm.id);
                    });
                    grid.appendChild(card);
                });
        }

        /* ============================================================
           增 / 改 弹窗
           ============================================================ */
        const editOverlay = document.getElementById("editOverlay");
        let editingId = null;

        function openEditModal(bm) {
            editingId = bm ? bm.id : null;
            document.getElementById("editTitle").textContent = bm ? "编辑书签" : "添加书签";
            document.getElementById("f-title").value = bm ? bm.title : "";
            document.getElementById("f-url").value = bm ? bm.url : "";
            const cat = bm ? (bm.category || "") : "";
            document.getElementById("f-category").value = cat;
            refreshCategoryDatalist(cat || undefined);
            document.getElementById("f-tags").value = bm ? (bm.tags || []).join(",") : "";
            document.getElementById("f-desc").value = bm ? bm.desc : "";
            document.getElementById("f-fav").checked = bm ? !!bm.favorite : false;
            editOverlay.classList.add("show");
        }
        document.getElementById("addBtn").onclick = () => requirePassword(() => openEditModal(null));
        document.getElementById("editCancel").onclick = () => editOverlay.classList.remove("show");

        document.getElementById("editSave").onclick = async () => {
            const payload = {
                title: document.getElementById("f-title").value.trim(),
                url: document.getElementById("f-url").value.trim(),
                category: document.getElementById("f-category").value.trim() || "未分类",
                tags: document.getElementById("f-tags").value.split(",").map(s => s.trim()).filter(Boolean),
                desc: document.getElementById("f-desc").value.trim(),
                favorite: document.getElementById("f-fav").checked,
            };
            if (!payload.url) {
                showToast("URL 不能为空", "error");
                return;
            }

            try {
                if (editingId) {
                    await authFetch(`/api/bookmarks/${editingId}`, { method: "PUT", body: JSON.stringify(payload) });
                    showToast("修改成功", "success");
                } else {
                    await authFetch(`/api/bookmarks`, { method: "POST", body: JSON.stringify(payload) });
                    showToast("添加成功", "success");
                }
                editOverlay.classList.remove("show");
                await loadBookmarks();
            } catch (e) {
                showToast("操作失败，请重试", "error");
            }
        };

        /* ============================================================
           删除弹窗
           ============================================================ */
        const delOverlay = document.getElementById("delOverlay");
        let deletingId = null;

        function openDeleteModal(id) {
            deletingId = id;
            delOverlay.classList.add("show");
        }
        document.getElementById("delCancel").onclick = () => {
            delOverlay.classList.remove("show");
            deletingId = null;
        };
        document.getElementById("delConfirm").onclick = async () => {
            if (!deletingId) return;
            try {
                await authFetch(`/api/bookmarks/${deletingId}`, { method: "DELETE" });
                showToast("已删除", "success");
                delOverlay.classList.remove("show");
                await loadBookmarks();
            } catch (e) {
                showToast("删除失败，请重试", "error");
            }
        };

        /* ============================================================
           书签搜索过滤 + 清除
           ============================================================ */
        const bmSearchInput = document.getElementById("bmSearch");
        const bmSearchClear = document.getElementById("bmSearchClear");

        function syncBmSearchClear() {
            bmSearchClear.classList.toggle("show", !!bmSearchInput.value);
        }

        bmSearchInput.addEventListener("input", () => {
            searchKeyword = bmSearchInput.value;
            syncBmSearchClear();
            renderGrid();
        });
        bmSearchClear.addEventListener("click", () => {
            bmSearchInput.value = "";
            searchKeyword = "";
            syncBmSearchClear();
            renderGrid();
            bmSearchInput.focus();
        });

        /* ============================================================
           视图切换
           ============================================================ */
        const viewToggle = document.getElementById("viewToggle");

        function updateViewButton() {
            if (!viewToggle) return;
            const icon = viewToggle.querySelector(".iconify");
            icon.dataset.icon = viewMode === "grid" ? "lucide:list" : "lucide:layout-grid";
            viewToggle.classList.toggle("active", viewMode === "list");
        }
