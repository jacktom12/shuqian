        viewToggle.addEventListener("click", () => {
            viewMode = viewMode === "grid" ? "list" : "grid";
            localStorage.setItem("bm_view_mode", viewMode);
            updateViewButton();
            renderGrid();
        });

        updateViewButton();

        /* ============================================================
           深浅主题切换（只换 <html data-theme>，样式全靠 CSS 变量跟随）
           ============================================================ */
        const THEME_KEY = "bm_theme";
        const themeToggle = document.getElementById("themeToggle");

        function applyTheme(theme) {
            document.documentElement.dataset.theme = theme;
            try { localStorage.setItem(THEME_KEY, theme); } catch (e) {}
            if (!themeToggle) return;
            const isLight = theme === "light";
            const icon = themeToggle.querySelector(".iconify");
            // 暗色时显示太阳（点一下变亮），浅色时显示月亮（点一下变暗）
            icon.dataset.icon = isLight ? "lucide:moon" : "lucide:sun";
            themeToggle.dataset.tip = isLight ? "切换到深色模式" : "切换到浅色模式";
        }

        themeToggle.addEventListener("click", () => {
            applyTheme(document.documentElement.dataset.theme === "light" ? "dark" : "light");
        });

        applyTheme(document.documentElement.dataset.theme === "light" ? "light" : "dark");

        /* ============================================================
           手机端底部分类筛选（daisyUI filter；宽屏隐藏，不参与交互）
           ============================================================ */
        const mobileCatFilter = document.getElementById("mobileCatFilter");
        const mobileFilter = document.getElementById("mobileFilter");
        const filterHandle = document.getElementById("filterHandle");

        function renderMobileFilter() {
            if (!mobileCatFilter) return;
            const counts = getCategoryCounts();
            const cats = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
            const items = [
                { key: "__all__", label: "全部", count: bookmarks.length },
                { key: "__fav__", label: "收藏", count: bookmarks.filter(b => b.favorite).length },
                ...cats.map(c => ({ key: c, label: c, count: counts[c] })),
            ];
            // 用 <label> 包裹：避开了 iOS Safari 对 input 伪元素渲染异常
            // （daisyUI filter 原生用 input + ::before 注入文字，会在 iOS 上重复两遍）
            mobileCatFilter.innerHTML = items
                .map(
                    it =>
                        `<label class="cat-chip" data-cat="${escapeHtml(it.key)}">` +
                        `<input type="radio" name="bm_cat_filter" value="${escapeHtml(it.key)}"` +
                        `${activeCategory === it.key ? " checked" : ""} />` +
                        `<span class="cat-chip-text">${escapeHtml(it.label)} ${it.count}</span>` +
                        `</label>`
                )
                .join("");
        }

        // 事件委托：radio change 冒泡，统一在这里切换分类
        mobileCatFilter.addEventListener("change", (e) => {
            const label = e.target.closest(".cat-chip");
            if (!label || !label.dataset.cat) return;
            activeCategory = label.dataset.cat;
            renderSidebar(); // 同步桌面侧边栏高亮
            renderGrid();
            document.getElementById("contentScroll").scrollTo({ top: 0, behavior: "smooth" });
            // 切完分类后收起抽屉（用户大概率想看书签，不想再被底部条挡）
            mobileFilter.classList.remove("expanded");
            syncHandleState();
        });

        /* ============================================================
           手机端功能菜单抽屉（≤600px 生效；桌面端按钮原位显示不受影响）
           ============================================================ */
        const menuBtn = document.getElementById("menuBtn");
        const menuMask = document.getElementById("menuMask");
        if (menuBtn && menuMask) {
            menuBtn.addEventListener("click", () => {
                document.body.classList.toggle("menu-open");
            });
            menuMask.addEventListener("click", () => {
                document.body.classList.remove("menu-open");
            });
        }

        // 手柄交互：点击切换 + 在手柄上向上滑/向下滑也能切换
        function syncHandleState() {
            if (!filterHandle) return;
            const expanded = mobileFilter.classList.contains("expanded");
            filterHandle.setAttribute("aria-label", expanded ? "收起分类" : "展开分类");
            const hint = filterHandle.querySelector(".handle-hint");
            if (hint) hint.textContent = expanded ? "收起" : "更多分类";
            filterHandle.setAttribute("aria-expanded", String(expanded));
            filterHandle.querySelector(".iconify").dataset.icon = expanded ? "lucide:chevron-down" : "lucide:chevron-up";
        }
        filterHandle.addEventListener("click", () => {
            mobileFilter.classList.toggle("expanded");
            syncHandleState();
        });
        // 手柄上的滑动手势：向上滑展开，向下滑收起（阈值 24px，避免误触）
        let handleTouchY = null;
        let handleTouchExpanded = false;
        filterHandle.addEventListener("touchstart", (e) => {
            handleTouchY = e.touches[0].clientY;
            handleTouchExpanded = mobileFilter.classList.contains("expanded");
        }, { passive: true });
        filterHandle.addEventListener("touchend", (e) => {
            if (handleTouchY == null) return;
            const dy = e.changedTouches[0].clientY - handleTouchY;
            handleTouchY = null;
            if (Math.abs(dy) < 24) return;
            const shouldExpand = dy < 0; // 向上为负
            if (shouldExpand !== handleTouchExpanded) {
                mobileFilter.classList.toggle("expanded", shouldExpand);
                syncHandleState();
            }
        });

        /* ============================================================
           启动
           ============================================================ */
        syncQueryClear();
        syncBmSearchClear();
        setWallpaper();
        loadBookmarks();
    </script>
</body>
</html>
